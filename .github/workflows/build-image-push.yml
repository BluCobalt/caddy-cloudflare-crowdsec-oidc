name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      caddy-version: ${{ steps.caddy_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: build/go.mod
          cache-dependency-path: build/go.sum

      - name: Read Caddy version
        id: caddy_version
        working-directory: build
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/caddyserver/caddy/v2)"
          echo "Caddy version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.version=${{ steps.caddy_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/blucobalt/caddy-cloudflare-crowdsec-oidc:latest
            ghcr.io/blucobalt/caddy-cloudflare-crowdsec-oidc:${{ github.sha }}
            ghcr.io/blucobalt/caddy-cloudflare-crowdsec-oidc:${{ steps.caddy_version.outputs.version }}
